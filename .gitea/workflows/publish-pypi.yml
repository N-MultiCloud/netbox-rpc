name: Publish Gitea PyPI package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact committed X.Y.Z[(a|b|rc)N][.postN][.devN] version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: netbox-rpc-package-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and attest package
    if: ${{ github.repository == 'N-MultiCloud/netbox-rpc' && github.ref == 'refs/heads/main' }}
    runs-on: package-publish
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: "1"
      RELEASE_TOOLS: ${{ runner.temp }}/netbox-rpc-release-tools-${{ github.run_id }}-${{ github.run_attempt }}
      TWINE_CONFIG_FILE: /dev/null
    steps:
      - name: Checkout immutable canonical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: "false"

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"

      - name: Validate exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "N-MultiCloud/netbox-rpc"
          test "$GITHUB_REF" = "refs/heads/main"
          VERSION="$PACKAGE_VERSION" python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          pattern = re.compile(
              r'^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
              r'(?:(?:a|b|rc)(?:0|[1-9][0-9]*))?'
              r'(?:\.post(?:0|[1-9][0-9]*))?'
              r'(?:\.dev(?:0|[1-9][0-9]*))?$'
          )
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if pattern.fullmatch(version) is None:
              raise SystemExit("Release version is not canonical")
          if project.get("name") != "netbox-rpc" or project.get("version") != version:
              raise SystemExit("Release version must already be committed")
          PY
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install hash-locked release tools
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RELEASE_TOOLS"
          python -I -m venv "$RELEASE_TOOLS"
          "$RELEASE_TOOLS/bin/python" -I -m pip install \
            --disable-pip-version-check --isolated --no-cache-dir --no-deps \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --requirement .gitea/release-tools.lock
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/generate_deploy_manifest.py

      - name: Build and check exact package artifacts
        run: |
          set -euo pipefail
          "$RELEASE_TOOLS/bin/python" -I -m build --no-isolation
          "$RELEASE_TOOLS/bin/python" -I -m twine check dist/*

      - name: Create and verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/release_artifacts.py manifest \
            --dist dist --package netbox-rpc --version "$PACKAGE_VERSION" \
            --source-sha "$SOURCE_SHA" --manifest release-manifest.json
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/release_artifacts.py verify \
            --dist dist --package netbox-rpc --version "$PACKAGE_VERSION" \
            --source-sha "$SOURCE_SHA" --manifest release-manifest.json

      - name: Resume exact package publication
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PACKAGE_WRITE_TOKEN }}
          TWINE_USERNAME: ${{ secrets.PACKAGE_USER }}
          TWINE_PASSWORD: ${{ secrets.PACKAGE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing="$RUNNER_TEMP/netbox-rpc-missing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/release_artifacts.py missing-gitea \
            --owner N-MultiCloud --repository netbox-rpc \
            --manifest release-manifest.json > "$missing"
          while IFS= read -r artifact; do
            test -n "$artifact"
            case "$artifact" in
              "netbox_rpc-${PACKAGE_VERSION}-py3-none-any.whl" | \
              "netbox_rpc-${PACKAGE_VERSION}.tar.gz") ;;
              *) echo "Unexpected artifact publication request" >&2; exit 1 ;;
            esac
            "$RELEASE_TOOLS/bin/python" -I -m twine upload \
              --non-interactive --disable-progress-bar \
              --repository-url https://git.nmulti.cloud/api/packages/N-MultiCloud/pypi \
              "dist/$artifact"
          done < "$missing"
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/release_artifacts.py complete-gitea \
            --owner N-MultiCloud --repository netbox-rpc \
            --manifest release-manifest.json

      - name: Publish immutable release evidence last
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PACKAGE_WRITE_TOKEN }}
        run: >-
          "$RELEASE_TOOLS/bin/python" -I .gitea/scripts/release_artifacts.py publish-manifest
          --owner N-MultiCloud --repository netbox-rpc
          --manifest release-manifest.json
