name: Integration tests (NetBox DB-backed)

# Manual, non-gating diagnostics only. This workflow touches a privileged host
# and must never execute candidate pull-request or push code. It is not the
# canonical Gitea pull-request DB gate. That gate requires a separately
# provisioned isolated untrusted runner with disposable digest-pinned
# PostgreSQL/Redis and exact hash-locked NetBox 4.5.8, 4.6.5, and 4.7.0
# dependency closures. Older lines contain source-only dependencies, which are
# built without isolation only after installing the hash-pinned build backend.
#
# Both jobs are operator-requested diagnostics restricted to the canonical main
# ref. They are never required pull-request evidence or a branch-protection
# gate. Trusted Gitea runner/ref eligibility remains the authority; these
# main-only checks are defense in depth only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netbox-rpc-integration
  cancel-in-progress: false

jobs:
  integration:
    name: manage.py test netbox_rpc
    if: ${{ github.repository == 'N-MultiCloud/netbox-rpc' && github.ref == 'refs/heads/main' }}
    runs-on: mirror-host
    timeout-minutes: 30
    env:
      NETBOX_ROOT: /opt/netbox
      NETBOX_DB_NAME: netbox_rpc_citest
      NETBOX_DB_USER: netbox
      NETBOX_DB_PASSWORD: ${{ secrets.NETBOX_DB_PASSWORD }}
      NETBOX_DB_HOST: localhost
      NETBOX_SECRET_KEY: ci-integration-secret-key-0123456789abcdefghij-abcdef
    steps:
      - name: Preflight (soft-skip if unconfigured)
        id: preflight
        shell: bash
        run: |
          set -eo pipefail
          if [ ! -x "${NETBOX_ROOT}/venv/bin/python" ]; then
            echo "::notice::NetBox venv not found at ${NETBOX_ROOT}; skipping this optional operator diagnostic."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${NETBOX_DB_PASSWORD}" ]; then
            echo "::notice::NETBOX_DB_PASSWORD secret is not configured; skipping this optional operator diagnostic."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node is required for checkout on configured mirror-host." >&2
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provision a UTF8 test database
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -eo pipefail
          # NetBox's natural-sort ICU collation requires a UTF8 database. Some
          # hosts default new databases to SQL_ASCII, so pre-create the Django
          # test database (test_<NAME>) as UTF8 and reuse it with --keepdb.
          if command -v sudo >/dev/null 2>&1 && id postgres >/dev/null 2>&1; then
            sudo -n -u postgres psql -d postgres -c "ALTER ROLE ${NETBOX_DB_USER} CREATEDB" || true
            sudo -n -u postgres psql -d postgres -c "DROP DATABASE IF EXISTS test_${NETBOX_DB_NAME}" || true
            sudo -n -u postgres psql -d postgres -c "CREATE DATABASE test_${NETBOX_DB_NAME} OWNER ${NETBOX_DB_USER} TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
          fi

      - name: Run the integration suite
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/tests/ci:${NETBOX_ROOT}/netbox"
          export NETBOX_CONFIGURATION=netbox_configuration
          export DJANGO_SETTINGS_MODULE=netbox.settings
          "${NETBOX_ROOT}/venv/bin/python" "${NETBOX_ROOT}/netbox/manage.py" test netbox_rpc --keepdb --verbosity 2

  compatibility:
    name: NetBox ${{ matrix.netbox-version }} compatibility
    if: ${{ github.repository == 'N-MultiCloud/netbox-rpc' && github.ref == 'refs/heads/main' }}
    runs-on: trusted-exact
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The mirror-host runner also provides the additive /opt/netbox job.
      # Serialize the matrix and use non-default host ports so its local
      # Postgres/Redis services cannot collide with this hermetic gate.
      max-parallel: 1
      matrix:
        include:
          - netbox-version: v4.5.8
            netbox-tag: v4.5.8
            netbox-ref: 75e1b86613792458b4d4c8d0cbbfc94df16cfaaf
            compat-db: netbox_rpc_compat_n458
            redis-port: '16388'
            redis-tasks-db: '0'
            redis-cache-db: '1'
          - netbox-version: v4.6.5
            netbox-tag: v4.6.5
            netbox-ref: ebee3578b90901ba69ea646815f9b0662f627726
            compat-db: netbox_rpc_compat_n465
            redis-port: '16389'
            redis-tasks-db: '0'
            redis-cache-db: '1'
          - netbox-version: v4.7.0
            netbox-tag: v4.7.0
            netbox-ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
            compat-db: netbox_rpc_compat_n470
            redis-port: '16390'
            redis-tasks-db: '0'
            redis-cache-db: '1'
    # mirror-host is a host-mode executor: it cannot provision Docker service
    # containers, so this gate uses host PostgreSQL plus a dedicated
    # authenticated Redis process per matrix leg. Each leg gets its own UTF8
    # database and Redis port; no production or staging Redis database is
    # reachable from the compatibility environment.
    env:
      HOME: ${{ github.workspace }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      NETBOX_VERSION: ${{ matrix.netbox-version }}
      NETBOX_TAG: ${{ matrix.netbox-tag }}
      NETBOX_REF: ${{ matrix.netbox-ref }}
      NETBOX_DB_NAME: ${{ matrix.compat-db }}
      # The gate provisions its own role and databases; it does not use
      # the production credentials.
      NETBOX_DB_USER: netbox_rpc_ci
      NETBOX_DB_PASSWORD: netbox_rpc_ci
      NETBOX_DB_HOST: localhost
      NETBOX_DB_PORT: "5432"
      NETBOX_REDIS_HOST: localhost
      NETBOX_REDIS_PORT: ${{ matrix.redis-port }}
      NETBOX_REDIS_DB_TASKS: ${{ matrix.redis-tasks-db }}
      NETBOX_REDIS_DB_CACHE: ${{ matrix.redis-cache-db }}
      NETBOX_SECRET_KEY: gitea-actions-integration-secret-key-0123456789-abcdef
    steps:
      - name: Preflight (fail if host services are unavailable)
        shell: bash
        run: |
          set -eo pipefail
          command -v sudo >/dev/null 2>&1 || { echo "sudo unavailable" >&2; exit 1; }
          id postgres >/dev/null 2>&1 || { echo "host postgres unavailable" >&2; exit 1; }

      - name: Prepare private toolchain root
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_WORKSPACE:-}"
          runner_temp="$(/usr/bin/realpath -e "$RUNNER_TEMP")"
          workspace="$(/usr/bin/realpath -e "$GITHUB_WORKSPACE")"
          case "$runner_temp" in
            "$workspace"|"$workspace"/*)
              echo "::error::RUNNER_TEMP must be outside GITHUB_WORKSPACE." >&2
              exit 1
              ;;
          esac
          created_root=""
          toolchain_root=""
          cleanup_failed_prepare() {
            prepare_status=$?
            trap - ERR INT TERM
            if [ "$prepare_status" -eq 0 ]; then
              prepare_status=1
            fi
            if [ -n "${created_root:-}" ] && [ -e "$created_root" ] && [ ! -L "$created_root" ]; then
              if cleanup_root="$(/usr/bin/realpath -e "$created_root")"; then
                case "$(/usr/bin/basename "$cleanup_root")" in
                  netbox-rpc-toolchain.??????)
                    if [ "$(/usr/bin/dirname "$cleanup_root")" = "$runner_temp" ] && [ "$cleanup_root" != "$workspace" ]; then
                      /usr/bin/rm -rf -- "$cleanup_root" || true
                    fi
                    ;;
                esac
              fi
            fi
            exit "$prepare_status"
          }
          created_root="$(/usr/bin/mktemp -d "${runner_temp}/netbox-rpc-toolchain.XXXXXX")"
          trap cleanup_failed_prepare ERR INT TERM
          toolchain_root="$(/usr/bin/realpath -e "$created_root")"
          test ! -L "$toolchain_root"
          test "$(/usr/bin/dirname "$toolchain_root")" = "$runner_temp"
          case "$(/usr/bin/basename "$toolchain_root")" in
            netbox-rpc-toolchain.??????) ;;
            *) echo "::error::Unexpected private toolchain path." >&2; exit 1 ;;
          esac
          /usr/bin/chmod 0700 "$toolchain_root"
          for directory in tmp tool-cache uv-cache uv-python uv-tools uv-tool-bin; do
            /usr/bin/install -d -m 0700 "$toolchain_root/$directory"
          done
          printf 'root=%s\n' "$toolchain_root" >> "$GITHUB_OUTPUT"
          printf 'tool_cache=%s\n' "$toolchain_root/tool-cache" >> "$GITHUB_OUTPUT"
          printf 'uv_cache=%s\n' "$toolchain_root/uv-cache" >> "$GITHUB_OUTPUT"
          printf 'uv_python=%s\n' "$toolchain_root/uv-python" >> "$GITHUB_OUTPUT"
          printf 'uv_tools=%s\n' "$toolchain_root/uv-tools" >> "$GITHUB_OUTPUT"
          printf 'uv_tool_bin=%s\n' "$toolchain_root/uv-tool-bin" >> "$GITHUB_OUTPUT"
          printf 'temp=%s\n' "$toolchain_root/tmp" >> "$GITHUB_OUTPUT"
          trap - ERR INT TERM

      - name: Install pinned uv
        id: uv
        uses: https://github.com/astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        env:
          RUNNER_TEMP: ${{ steps.toolchain.outputs.temp }}
          TMPDIR: ${{ steps.toolchain.outputs.temp }}
          RUNNER_TOOL_CACHE: ${{ steps.toolchain.outputs.tool_cache }}
          UV_CACHE_DIR: ${{ steps.toolchain.outputs.uv_cache }}
          UV_PYTHON_INSTALL_DIR: ${{ steps.toolchain.outputs.uv_python }}
          UV_TOOL_DIR: ${{ steps.toolchain.outputs.uv_tools }}
          UV_TOOL_BIN_DIR: ${{ steps.toolchain.outputs.uv_tool_bin }}
          UV_NO_MODIFY_PATH: "1"
        with:
          version: "0.12.5"
          python-version: "3.12.14"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          github-token: ""
          download-from-astral-mirror: false
          enable-cache: false
          add-problem-matchers: false

      - name: Provision exact task-private Python 3.12
        id: interpreter
        shell: bash
        env:
          TOOLCHAIN_ROOT: ${{ steps.toolchain.outputs.root }}
          UV_BIN: ${{ steps.uv.outputs.uv-path }}
          UV_CACHE_DIR: ${{ steps.toolchain.outputs.uv_cache }}
          UV_PYTHON_INSTALL_DIR: ${{ steps.toolchain.outputs.uv_python }}
          UV_TOOL_DIR: ${{ steps.toolchain.outputs.uv_tools }}
          UV_TOOL_BIN_DIR: ${{ steps.toolchain.outputs.uv_tool_bin }}
          TMPDIR: ${{ steps.toolchain.outputs.temp }}
          UV_NO_CONFIG: "1"
          UV_NO_SOURCES: "1"
          UV_PYTHON_INSTALL_BIN: "0"
          UV_PYTHON_DOWNLOADS: manual
        run: |
          set -euo pipefail
          toolchain_root="$(/usr/bin/realpath -e "$TOOLCHAIN_ROOT")"
          uv_bin="$(/usr/bin/realpath -e "$UV_BIN")"
          case "$uv_bin" in
            "$toolchain_root"/*) ;;
            *) echo "::error::uv executable escaped private toolchain root." >&2; exit 1 ;;
          esac
          # Verify the contained setup action output before provisioning Python.
          if [ ! -x "$uv_bin" ]; then
            echo "::error::Missing exact uv executable: $uv_bin" >&2
            exit 1
          fi
          if uv_identity="$("$uv_bin" --version)"; then
            :
          else
            uv_probe_status=$?
            printf '::error::Exact uv version probe failed for %s with status %s.\n' "$uv_bin" "$uv_probe_status" >&2
            exit "$uv_probe_status"
          fi
          printf 'uv identity: %s\n' "$uv_identity"
          test "$uv_identity" = "uv 0.12.5 (x86_64-unknown-linux-gnu)"
          "$uv_bin" python install 3.12.14 \
            --no-bin \
            --no-config \
            --no-cache \
            --no-progress
          python_bin="$(UV_PYTHON_DOWNLOADS=never "$uv_bin" python find --managed-python 3.12.14)"
          python_bin="$(/usr/bin/realpath -e "$python_bin")"
          case "$python_bin" in
            "$toolchain_root"/*) ;;
            *) echo "::error::Python executable escaped private toolchain root." >&2; exit 1 ;;
          esac
          # Verify the contained managed-interpreter output before creating the venv.
          if [ ! -x "$python_bin" ]; then
            echo "::error::Missing exact Python executable: $python_bin" >&2
            exit 1
          fi
          if python_identity="$("$python_bin" --version)"; then
            :
          else
            python_probe_status=$?
            printf '::error::Exact Python version probe failed for %s with status %s.\n' "$python_bin" "$python_probe_status" >&2
            exit "$python_probe_status"
          fi
          printf 'Python identity: %s\n' "$python_identity"
          test "$python_identity" = "Python 3.12.14"
          "$python_bin" -I -S - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython":
              raise SystemExit("CI requires CPython")
          if sys.version_info[:3] != (3, 12, 14):
              raise SystemExit("CI requires CPython 3.12.14")
          if platform.machine() != "x86_64":
              raise SystemExit("CI requires x86_64")
          libc_name, libc_version = platform.libc_ver()
          if libc_name != "glibc":
              raise SystemExit("CI requires glibc")
          if tuple(map(int, libc_version.split("."))) < (2, 34):
              raise SystemExit("CI requires glibc 2.34 or newer")
          PY
          UV_PYTHON_DOWNLOADS=never "$uv_bin" venv \
            --python "$python_bin" \
            --no-managed-python \
            --no-python-downloads \
            --no-project \
            --no-config \
            --no-cache \
            .ci-venv
          printf 'python_bin=%s\n' "$python_bin" >> "$GITHUB_OUTPUT"
          printf 'uv_bin=%s\n' "$uv_bin" >> "$GITHUB_OUTPUT"

      - name: Provision a UTF8 compatibility database
        shell: bash
        run: |
          set -eo pipefail
          sudo -n -u postgres psql -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='${NETBOX_DB_USER}'" | grep -q 1 || \
            sudo -n -u postgres psql -d postgres -c "CREATE ROLE ${NETBOX_DB_USER} LOGIN PASSWORD '${NETBOX_DB_PASSWORD}' CREATEDB"
          for db in "${NETBOX_DB_NAME}" "test_${NETBOX_DB_NAME}"; do
            sudo -n -u postgres psql -d postgres -c "DROP DATABASE IF EXISTS ${db}" || true
            sudo -n -u postgres psql -d postgres -c "CREATE DATABASE ${db} OWNER ${NETBOX_DB_USER} TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
          done

      - name: Start isolated authenticated Redis
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl >/dev/null 2>&1 || { echo "openssl unavailable" >&2; exit 1; }
          command -v redis-server >/dev/null 2>&1 || { echo "redis-server unavailable" >&2; exit 1; }
          command -v redis-cli >/dev/null 2>&1 || { echo "redis-cli unavailable" >&2; exit 1; }
          redis_password="$(openssl rand -hex 32)"
          redis_pidfile="${RUNNER_TEMP}/netbox-rpc-redis-${NETBOX_REDIS_PORT}.pid"
          redis-server \
            --bind 127.0.0.1 \
            --port "${NETBOX_REDIS_PORT}" \
            --requirepass "${redis_password}" \
            --save "" \
            --appendonly no \
            --daemonize yes \
            --pidfile "${redis_pidfile}"
          printf 'NETBOX_REDIS_PASSWORD=%s\n' "${redis_password}" >> "${GITHUB_ENV}"
          printf 'NETBOX_REDIS_PIDFILE=%s\n' "${redis_pidfile}" >> "${GITHUB_ENV}"
          for attempt in {1..20}; do
            redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${redis_password}" ping >/dev/null 2>&1 && break
            sleep 1
          done
          redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${redis_password}" ping | grep -Fx PONG

      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: plugin

      - name: Check out NetBox
        shell: bash
        run: |
          set -eo pipefail
          git init netbox
          git -C netbox remote add origin https://github.com/netbox-community/netbox.git
          git -C netbox fetch --depth 1 origin "refs/tags/${NETBOX_TAG}:refs/tags/${NETBOX_TAG}"
          git -C netbox fetch --depth 1 origin "${NETBOX_REF}"
          git -C netbox checkout --detach "${NETBOX_REF}"
          test "$(git -C netbox rev-parse HEAD)" = "${NETBOX_REF}"
          test "$(git -C netbox rev-parse "${NETBOX_TAG}^{commit}")" = "${NETBOX_REF}"

      - name: Install NetBox and plugin
        shell: bash
        env:
          UV_BIN: ${{ steps.interpreter.outputs.uv_bin }}
          TMPDIR: ${{ steps.toolchain.outputs.temp }}
        run: |
          set -euo pipefail
          test -x "$UV_BIN"
          UV_PYTHON_DOWNLOADS=never "$UV_BIN" pip install \
            --python .ci-venv \
            --require-hashes \
            --only-binary=:all: \
            --no-sources \
            --no-python-downloads \
            --no-config \
            --no-cache \
            --keyring-provider disabled \
            --index-strategy first-index \
            --default-index https://pypi.org/simple \
            --requirements plugin/.gitea/deploy/netbox-source-build.lock
          UV_PYTHON_DOWNLOADS=never "$UV_BIN" pip install \
            --python .ci-venv \
            --require-hashes \
            --no-build-isolation \
            --no-sources \
            --no-python-downloads \
            --no-config \
            --no-cache \
            --keyring-provider disabled \
            --index-strategy first-index \
            --default-index https://pypi.org/simple \
            --exact \
            --strict \
            --requirements "plugin/.gitea/deploy/netbox-${NETBOX_VERSION}-ci.lock"
          UV_PYTHON_DOWNLOADS=never "$UV_BIN" pip install \
            --python .ci-venv \
            --no-deps \
            --no-build-isolation \
            -e "./plugin"

      - name: Run compatibility checks (fresh database)
        shell: bash
        run: |
          set -eo pipefail
          . .ci-venv/bin/activate
          export PYTHONPATH="${GITHUB_WORKSPACE}/plugin/tests/ci:${GITHUB_WORKSPACE}/netbox/netbox"
          export NETBOX_CONFIGURATION=netbox_configuration
          export DJANGO_SETTINGS_MODULE=netbox.settings
          # The gate proves cross-version installability AND fresh-database
          # behavioral correctness: system checks, a complete migration run
          # (including all seed migrations), then the full DB-backed behavioral
          # suite on a freshly built database. The suite's pydantic/cryptography
          # deps come from `.ci-venv`'s `plugin[test]` install above.
          python netbox/netbox/manage.py check
          python netbox/netbox/manage.py migrate --no-input
          python netbox/netbox/manage.py test netbox_rpc --no-input

      - name: Stop isolated Redis
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${NETBOX_REDIS_PASSWORD:-}" ]; then
            redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${NETBOX_REDIS_PASSWORD}" shutdown nosave
          fi
          if [ -n "${NETBOX_REDIS_PIDFILE:-}" ] && [ -f "${NETBOX_REDIS_PIDFILE}" ]; then
            kill "$(cat "${NETBOX_REDIS_PIDFILE}")" 2>/dev/null || true
          fi

      - name: Remove private toolchain
        if: always()
        shell: bash
        env:
          TOOLCHAIN_ROOT: ${{ steps.toolchain.outputs.root }}
        run: |
          set -euo pipefail
          if [ -z "${TOOLCHAIN_ROOT:-}" ] || [ ! -e "$TOOLCHAIN_ROOT" ]; then
            exit 0
          fi
          runner_temp="$(/usr/bin/realpath -e "$RUNNER_TEMP")"
          workspace="$(/usr/bin/realpath -e "$GITHUB_WORKSPACE")"
          toolchain_root="$(/usr/bin/realpath -e "$TOOLCHAIN_ROOT")"
          test ! -L "$TOOLCHAIN_ROOT"
          test "$toolchain_root" != "$workspace"
          test "$(/usr/bin/dirname "$toolchain_root")" = "$runner_temp"
          case "$(/usr/bin/basename "$toolchain_root")" in
            netbox-rpc-toolchain.??????) ;;
            *) echo "::error::Refusing unsafe private toolchain cleanup path." >&2; exit 1 ;;
          esac
          /usr/bin/rm -rf -- "$toolchain_root"
