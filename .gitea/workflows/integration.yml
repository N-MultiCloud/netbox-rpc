name: Integration tests (NetBox DB-backed)

# Manual, non-gating diagnostics only. This workflow touches a privileged host
# and must never execute candidate pull-request or push code. It is not the
# canonical Gitea pull-request DB gate. That gate requires a separately
# provisioned isolated untrusted runner with disposable digest-pinned
# PostgreSQL/Redis and an exact hash-locked NetBox 4.7.0 GA closure.
#
# Both jobs are operator-requested diagnostics restricted to the canonical main
# ref. They are never required pull-request evidence or a branch-protection
# gate. Trusted Gitea runner/ref eligibility remains the authority; these
# main-only checks are defense in depth only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: manage.py test netbox_rpc
    if: ${{ github.repository == 'N-MultiCloud/netbox-rpc' && github.ref == 'refs/heads/main' }}
    runs-on: mirror-host
    env:
      NETBOX_ROOT: /opt/netbox
      NETBOX_DB_NAME: netbox_rpc_citest
      NETBOX_DB_USER: netbox
      NETBOX_DB_PASSWORD: ${{ secrets.NETBOX_DB_PASSWORD }}
      NETBOX_DB_HOST: localhost
      NETBOX_SECRET_KEY: ci-integration-secret-key-0123456789abcdefghij-abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preflight (soft-skip if unconfigured)
        id: preflight
        shell: bash
        run: |
          set -eo pipefail
          if [ ! -x "${NETBOX_ROOT}/venv/bin/python" ]; then
            echo "::notice::NetBox venv not found at ${NETBOX_ROOT}; skipping this optional operator diagnostic."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${NETBOX_DB_PASSWORD}" ]; then
            echo "::notice::NETBOX_DB_PASSWORD secret is not configured; skipping this optional operator diagnostic."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Provision a UTF8 test database
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -eo pipefail
          # NetBox's natural-sort ICU collation requires a UTF8 database. Some
          # hosts default new databases to SQL_ASCII, so pre-create the Django
          # test database (test_<NAME>) as UTF8 and reuse it with --keepdb.
          if command -v sudo >/dev/null 2>&1 && id postgres >/dev/null 2>&1; then
            sudo -n -u postgres psql -d postgres -c "ALTER ROLE ${NETBOX_DB_USER} CREATEDB" || true
            sudo -n -u postgres psql -d postgres -c "DROP DATABASE IF EXISTS test_${NETBOX_DB_NAME}" || true
            sudo -n -u postgres psql -d postgres -c "CREATE DATABASE test_${NETBOX_DB_NAME} OWNER ${NETBOX_DB_USER} TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
          fi

      - name: Run the integration suite
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/tests/ci:${NETBOX_ROOT}/netbox"
          export NETBOX_CONFIGURATION=netbox_configuration
          export DJANGO_SETTINGS_MODULE=netbox.settings
          "${NETBOX_ROOT}/venv/bin/python" "${NETBOX_ROOT}/netbox/manage.py" test netbox_rpc --keepdb --verbosity 2

  compatibility:
    name: NetBox ${{ matrix.netbox-version }} compatibility
    if: ${{ github.repository == 'N-MultiCloud/netbox-rpc' && github.ref == 'refs/heads/main' }}
    runs-on: trusted-exact
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The mirror-host runner also provides the additive /opt/netbox job.
      # Serialize the matrix and use non-default host ports so its local
      # Postgres/Redis services cannot collide with this hermetic gate.
      max-parallel: 1
      matrix:
        include:
          - netbox-version: v4.7.0
            netbox-tag: v4.7.0
            netbox-ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
            compat-db: netbox_rpc_compat_n470
            redis-port: '16390'
            redis-tasks-db: '0'
            redis-cache-db: '1'
    # mirror-host is a host-mode executor: it cannot provision Docker service
    # containers, so this gate uses host PostgreSQL plus a dedicated
    # authenticated Redis process per matrix leg. Each leg gets its own UTF8
    # database and Redis port; no production or staging Redis database is
    # reachable from the compatibility environment.
    env:
      HOME: ${{ github.workspace }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      NETBOX_VERSION: ${{ matrix.netbox-version }}
      NETBOX_TAG: ${{ matrix.netbox-tag }}
      NETBOX_REF: ${{ matrix.netbox-ref }}
      NETBOX_DB_NAME: ${{ matrix.compat-db }}
      # The gate provisions its own role and databases; it does not use
      # the production credentials.
      NETBOX_DB_USER: netbox_rpc_ci
      NETBOX_DB_PASSWORD: netbox_rpc_ci
      NETBOX_DB_HOST: localhost
      NETBOX_DB_PORT: "5432"
      NETBOX_REDIS_HOST: localhost
      NETBOX_REDIS_PORT: ${{ matrix.redis-port }}
      NETBOX_REDIS_DB_TASKS: ${{ matrix.redis-tasks-db }}
      NETBOX_REDIS_DB_CACHE: ${{ matrix.redis-cache-db }}
      NETBOX_SECRET_KEY: gitea-actions-integration-secret-key-0123456789-abcdef
    steps:
      - name: Preflight (fail if host services are unavailable)
        shell: bash
        run: |
          set -eo pipefail
          command -v sudo >/dev/null 2>&1 || { echo "sudo unavailable" >&2; exit 1; }
          id postgres >/dev/null 2>&1 || { echo "host postgres unavailable" >&2; exit 1; }

      - name: Provision a UTF8 compatibility database
        shell: bash
        run: |
          set -eo pipefail
          sudo -n -u postgres psql -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='${NETBOX_DB_USER}'" | grep -q 1 || \
            sudo -n -u postgres psql -d postgres -c "CREATE ROLE ${NETBOX_DB_USER} LOGIN PASSWORD '${NETBOX_DB_PASSWORD}' CREATEDB"
          for db in "${NETBOX_DB_NAME}" "test_${NETBOX_DB_NAME}"; do
            sudo -n -u postgres psql -d postgres -c "DROP DATABASE IF EXISTS ${db}" || true
            sudo -n -u postgres psql -d postgres -c "CREATE DATABASE ${db} OWNER ${NETBOX_DB_USER} TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
          done

      - name: Start isolated authenticated Redis
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl >/dev/null 2>&1 || { echo "openssl unavailable" >&2; exit 1; }
          command -v redis-server >/dev/null 2>&1 || { echo "redis-server unavailable" >&2; exit 1; }
          command -v redis-cli >/dev/null 2>&1 || { echo "redis-cli unavailable" >&2; exit 1; }
          redis_password="$(openssl rand -hex 32)"
          redis_pidfile="${RUNNER_TEMP}/netbox-rpc-redis-${NETBOX_REDIS_PORT}.pid"
          redis-server \
            --bind 127.0.0.1 \
            --port "${NETBOX_REDIS_PORT}" \
            --requirepass "${redis_password}" \
            --save "" \
            --appendonly no \
            --daemonize yes \
            --pidfile "${redis_pidfile}"
          for attempt in {1..20}; do
            redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${redis_password}" ping >/dev/null 2>&1 && break
            sleep 1
          done
          redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${redis_password}" ping | grep -Fx PONG
          printf 'NETBOX_REDIS_PASSWORD=%s\n' "${redis_password}" >> "${GITHUB_ENV}"
          printf 'NETBOX_REDIS_PIDFILE=%s\n' "${redis_pidfile}" >> "${GITHUB_ENV}"

      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: plugin

      - name: Set up uv and Python 3.12
        shell: bash
        run: |
          set -eo pipefail
          python_bin="/usr/local/bin/python3.12"
          uv_bin="/usr/local/bin/uv"
          test -x "${python_bin}"
          test -x "${uv_bin}"
          test "$("${python_bin}" --version)" = "Python 3.12.14"
          test "$("${uv_bin}" --version)" = "uv 0.12.5 (x86_64-unknown-linux-gnu)"
          "${uv_bin}" venv \
            --python "${python_bin}" \
            --no-managed-python \
            --no-python-downloads \
            --no-project \
            --no-config \
            --no-cache \
            .ci-venv

      - name: Check out NetBox
        shell: bash
        run: |
          set -eo pipefail
          git init netbox
          git -C netbox remote add origin https://github.com/netbox-community/netbox.git
          git -C netbox fetch --depth 1 origin "refs/tags/${NETBOX_TAG}:refs/tags/${NETBOX_TAG}"
          git -C netbox fetch --depth 1 origin "${NETBOX_REF}"
          git -C netbox checkout --detach "${NETBOX_REF}"
          test "$(git -C netbox rev-parse HEAD)" = "${NETBOX_REF}"
          test "$(git -C netbox rev-parse "${NETBOX_TAG}^{commit}")" = "${NETBOX_REF}"

      - name: Install NetBox and plugin
        shell: bash
        run: |
          set -eo pipefail
          /usr/local/bin/uv pip install \
            --python .ci-venv \
            --require-hashes \
            --only-binary=:all: \
            --no-sources \
            --no-python-downloads \
            --no-config \
            --no-cache \
            --keyring-provider disabled \
            --index-strategy first-index \
            --default-index https://pypi.org/simple \
            --exact \
            --strict \
            --requirements "plugin/.gitea/deploy/netbox-${NETBOX_VERSION}-ci.lock"
          /usr/local/bin/uv pip install \
            --python .ci-venv \
            --no-deps \
            --no-build-isolation \
            -e "./plugin"

      - name: Run compatibility checks (fresh database)
        shell: bash
        run: |
          set -eo pipefail
          . .ci-venv/bin/activate
          export PYTHONPATH="${GITHUB_WORKSPACE}/plugin/tests/ci:${GITHUB_WORKSPACE}/netbox/netbox"
          export NETBOX_CONFIGURATION=netbox_configuration
          export DJANGO_SETTINGS_MODULE=netbox.settings
          # The gate proves cross-version installability AND fresh-database
          # behavioral correctness: system checks, a complete migration run
          # (including all seed migrations), then the full DB-backed behavioral
          # suite on a freshly built database. The suite's pydantic/cryptography
          # deps come from `.ci-venv`'s `plugin[test]` install above.
          python netbox/netbox/manage.py check
          python netbox/netbox/manage.py migrate --no-input
          python netbox/netbox/manage.py test netbox_rpc --no-input

      - name: Stop isolated Redis
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${NETBOX_REDIS_PASSWORD:-}" ]; then
            redis-cli -h 127.0.0.1 -p "${NETBOX_REDIS_PORT}" -a "${NETBOX_REDIS_PASSWORD}" shutdown nosave
          fi
          if [ -n "${NETBOX_REDIS_PIDFILE:-}" ] && [ -f "${NETBOX_REDIS_PIDFILE}" ]; then
            kill "$(cat "${NETBOX_REDIS_PIDFILE}")" 2>/dev/null || true
          fi
