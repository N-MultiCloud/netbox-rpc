name: CI

# Run the netbox-rpc test suite on every push and pull request.
# Tests mock out Django and NetBox imports so no live NetBox instance is required.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax check and tests
    runs-on: ci-untrusted-python312
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CONFIG: "1"
      UV_NO_SOURCES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify preprovisioned toolchain
        shell: bash
        run: |
          set -euo pipefail
          python_bin="/usr/local/bin/python3.12"
          uv_bin="/usr/local/bin/uv"
          test -x "$python_bin"
          test -x "$uv_bin"
          test "$("$python_bin" --version)" = "Python 3.12.14"
          test "$("$uv_bin" --version)" = "uv 0.12.5"
          "$python_bin" -I -S - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython":
              raise SystemExit("CI requires CPython")
          if sys.version_info[:3] != (3, 12, 14):
              raise SystemExit("CI requires CPython 3.12.14")
          if platform.machine() != "x86_64":
              raise SystemExit("CI requires x86_64")
          libc_name, libc_version = platform.libc_ver()
          if libc_name != "glibc":
              raise SystemExit("CI requires glibc")
          if tuple(map(int, libc_version.split("."))) < (2, 34):
              raise SystemExit("CI requires glibc 2.34 or newer")
          PY

      - name: Create isolated venv and install locked wheels
        shell: bash
        run: |
          set -euo pipefail
          python_bin="/usr/local/bin/python3.12"
          uv_bin="/usr/local/bin/uv"
          test -x "$python_bin"
          test -x "$uv_bin"
          env -i \
            HOME="$HOME" \
            HTTP_PROXY="${HTTP_PROXY:-}" \
            HTTPS_PROXY="${HTTPS_PROXY:-}" \
            NO_PROXY="${NO_PROXY:-}" \
            UV_PYTHON_DOWNLOADS=never \
            UV_NO_CONFIG=1 \
            UV_NO_SOURCES=1 \
            "$uv_bin" venv \
              --python "$python_bin" \
              --no-managed-python \
              --no-python-downloads \
              --no-project \
              --no-config \
              --no-cache \
              .ci-venv
          env -i \
            HOME="$HOME" \
            HTTP_PROXY="${HTTP_PROXY:-}" \
            HTTPS_PROXY="${HTTPS_PROXY:-}" \
            NO_PROXY="${NO_PROXY:-}" \
            UV_PYTHON_DOWNLOADS=never \
            UV_NO_CONFIG=1 \
            UV_NO_SOURCES=1 \
            "$uv_bin" pip install \
              --python .ci-venv/bin/python \
              --python-version 3.12.14 \
              --python-platform x86_64-manylinux_2_34 \
              --no-managed-python \
              --require-hashes \
              --only-binary=:all: \
              --no-sources \
              --no-python-downloads \
              --no-config \
              --no-cache \
              --keyring-provider disabled \
              --index-strategy first-index \
              --default-index https://pypi.org/simple \
              --exact \
              --strict \
              --requirements .gitea/ci-requirements.lock

      - name: Syntax check (py_compile)
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/find netbox_rpc -name "*.py" -exec \
            /usr/bin/env -i PYTHONNOUSERSITE=1 \
            .ci-venv/bin/python -I -m py_compile {} +
          /usr/bin/find tests -name "*.py" -exec \
            /usr/bin/env -i PYTHONNOUSERSITE=1 \
            .ci-venv/bin/python -I -m py_compile {} +

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/env -i \
            PYTHONNOUSERSITE=1 \
            PYTEST_ADDOPTS= \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            .ci-venv/bin/python -I -m pytest \
              -p pytest_asyncio.plugin \
              -c .gitea/pytest-ci.ini \
              tests/ -q --tb=short
