name: Production deployment disabled in application repository

# Gitea selects workflow bytes from the event ref before a job starts. This
# repository accepts untrusted source branches, and the current organization
# runner scope still exposes privileged deployment labels to those branches.
# Keep this workflow inert until a separate locked control repository owns the
# fixed package and canonical-main deployment actions. A workflow-local ref
# check cannot protect a privileged runner from candidate-selected YAML.
on: {}
permissions: {}
jobs: {}
